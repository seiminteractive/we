server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # La app es una SPA con history mode: /admin no existe como archivo, asi que
  # cualquier ruta desconocida tiene que devolver index.html. Sin esto, entrar
  # directo a wecc.io/admin o recargar esa pagina da 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets llevan hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    # Un solo Cache-Control: la directiva expires emite el suyo y sumado a
    # add_header la respuesta salia con la cabecera duplicada.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea, para que un deploy se vea al instante.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  error_page 500 502 503 504 /50x.html;
}
